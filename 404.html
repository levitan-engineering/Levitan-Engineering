<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>הדף לא נמצא | לויתן הנדסה</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 34 30'%3E%3Cg fill='none' stroke='%230C0C0A' stroke-width='1.6'%3E%3Crect x='3' y='3' width='6' height='24' stroke='%231E3A5F'/%3E%3Crect x='10' y='11' width='5' height='16'/%3E%3Crect x='16' y='8' width='8' height='19'/%3E%3Crect x='20' y='15' width='11' height='12'/%3E%3Cline x1='1' y1='27.3' x2='33' y2='27.3'/%3E%3C/g%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .nf{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 24px;gap:6px}
    .nf .code{font-family:"Heebo",sans-serif;font-weight:200;font-size:clamp(80px,18vw,190px);line-height:1;letter-spacing:-.04em;color:var(--ink)}
    .nf .code em{font-style:normal;color:var(--ink-blue)}
    .nf h1{font-family:"Heebo",sans-serif;font-weight:300;font-size:clamp(22px,3.4vw,34px);letter-spacing:-.01em;margin:18px 0 0}
    .nf p{color:var(--stone);font-size:17px;margin:14px 0 0;max-width:42ch}
    .nf a.home{margin-top:34px;display:inline-flex;align-items:center;gap:10px;text-decoration:none;background:var(--ink);color:var(--paper);
      font-family:"Heebo",sans-serif;font-weight:400;font-size:15.5px;letter-spacing:.02em;padding:15px 30px;
      position:relative;overflow:hidden;transition:transform .3s var(--ease)}
    .nf a.home span{position:relative;z-index:1}
    .nf a.home::before{content:"";position:absolute;inset:0;background:var(--ink-blue);transform:translateY(101%);transition:transform .4s var(--ease)}
    .nf a.home:hover{transform:translateY(-2px)}
    .nf a.home:hover::before{transform:translateY(0)}
  </style>
</head>
<body>
  <div class="nf">
    <div class="code">4<em>0</em>4</div>
    <h1>הדף שחיפשתם לא נמצא.</h1>
    <p>ייתכן שהקישור שגוי או שהעמוד הוסר. בואו נחזיר אתכם הביתה.</p>
    <a class="home" href="/"><span>חזרה לדף הבית</span> <span aria-hidden="true">←</span></a>
  </div>
</body>
</html>
